aboutTitle:'About the Founder',founder:'Daniel Adegboyega',biography:["At Howard University, Daniel combines his studies in Economics and Computer Science with a passion for finance, entrepreneurship, and technology. During his freshman summer, Daniel worked as a Private Credit Summer Analyst in Direct Lending at Blackstone, where he focused on underwriting, credit analysis, and deal evaluation within private credit markets. He serves as an Analyst in the Howard University Investment Group and has developed experience in investment research, financial analysis, and strategic problem-solving.","During his sophomore summer, Daniel worked as a Strategic Capital Solutions Summer Analyst at New Catalyst Strategic Partners, where he focused on Deal Origination for emerging GP seeding and accelerating opportunities. His previous experiences include participation in programs such as AltFinance and other selective investment-focused training experiences.","Daniel believes that talent should never be limited by access and co-founded ARC Foundation to help students gain the mentorship, resources, and opportunities needed to achieve their full potential. He is passionate about building pathways that empower future leaders to create meaningful impact within their communities and beyond.","This upcoming summer, he will be heading to Goldman Sachs as a Global Banking & Markets Summer Analyst."],technicalTitle:'Technical Background',technical:'Daniel has been building websites for 6 years and studies Computer Science at Howard University. As a secondary school student, he built a Java flight-route optimisation application that was reviewed by Morgan Stanley software engineers. That mix of software engineering discipline and a finance and business mindset shapes how Caggely builds: clean code, measurable results, and a clear link between design and revenue.',badges:['Howard University','Blackstone','Goldman Sachs','Morgan Stanley (technical review)','ARC Foundation'],cvLabel:'View CV / Resume',linkedinLabel:'Connect on LinkedIn',

const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const arrow='<span class="arrow" aria-hidden="true">↗</span>';const docIcon='<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h8l4 4v14H6zM14 3v5h4M9 12h6M9 16h6"/></svg>';const linkedIcon='<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M7 10v7M7 7v.1M11 17v-7M11 13c0-4 6-4 6 0v4"/></svg>';
const button=(label,href='mailto:'+CONFIG.contactEmail,primary=false,extra='',icon='')=>`<a class="btn magnetic ${primary?'primary':''}" href="${esc(href==='#contact'?'mailto:'+CONFIG.contactEmail:href)}" ${extra}>${icon}<span>${esc(label)}</span>${arrow}</a>`;const nav=()=>CONFIG.nav.map(x=>`<a class="navlink" href="${x==='Contact'?'mailto:'+CONFIG.contactEmail:'#'+x.toLowerCase()}">${esc(x)}</a>`).join('');const eyebrow=s=>`<div class="eyebrow">${esc(s)}</div>`;const title=s=>esc(s).replace(/\n/g,'<br>');const format=(n,m)=>{if(n===null)return m.format==='growth'?CONFIG.baselineText:CONFIG.unavailable;if(m.format==='time')return `${Math.floor(n/60)}m ${String(Math.round(n%60)).padStart(2,'0')}s`;if(m.format==='percent')return (m.after%1?n.toFixed(1):Math.round(n))+'%';if(m.format==='growth')return '+'+Math.round(n)+'%';return Math.round(n).toLocaleString('en-GB')};
const metricHTML=(before)=>CONFIG.metrics.map((m,i)=>`<div class="metric"><div class="metric-label">${esc(m.label)}</div><div class="metric-value" ${before?'':`data-metric="${i}"`}>${before?format(m.before,m):format(0,m)}</div><div class="bar"><i ${before?'':`data-bar="${i}"`}></i></div></div>`).join('');

gely at a glance"><div class="marquee">${[0,1].map(copy=>`<div style="display:flex" ${copy?'aria-hidden="true"':''}>${CONFIG.trust.map(t=>`<span class="trust-item">${esc(t)}</span>`).join('')}</div>`).join('')}</div></div>

<section class="section cta"><div class="wrap reveal">${eyebrow(CONFIG.sectionLabels.cta)}<h2>${esc(CONFIG.cta)}</h2>${button(CONFIG.primary,'#contact',true)}</div></section>

const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;const fine=matchMedia('(pointer:fine)').matches;const menu=$('.menu');$('.navlinks').id='mobile-nav';menu.addEventListener('click',()=>{const open=menu.getAttribute('aria-expanded')!=='true';menu.setAttribute('aria-expanded',open);$('.navlinks').classList.toggle('open',open)});$$('.navlink').forEach(a=>a.addEventListener('click',()=>{menu.setAttribute('aria-expanded','false');$('.navlinks').classList.remove('open')}));document.addEventListener('keydown',e=>{if(e.key==='Escape'){menu.setAttribute('aria-expanded','false');$('.navlinks').classList.remove('open')}});
if(!reduced)document.body.classList.add('js-motion');const observer=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('visible');observer.unobserve(e.target)}}),{threshold:.08});$$('.reveal').forEach(el=>observer.observe(el));
let lastY=0,scrollQueued=false;const timeline=$('.timeline'),steps=$$('.step'),parallax=$$('.parallax');function scrollUpdate(){const y=scrollY,max=document.documentElement.scrollHeight-innerHeight;$('.progress').style.transform=`scaleX(${max?y/max:0})`;$('.header').classList.toggle('scrolled',y>25);$('.header').classList.toggle('hidden',y>160&&y>lastY&&menu.getAttribute('aria-expanded')!=='true'&&!$('.header').contains(document.activeElement));lastY=y;const r=timeline.getBoundingClientRect();const progress=Math.max(0,Math.min(1,(innerHeight*.72-r.top)/r.height));$('.timeline-line').style.transform=`scaleY(${progress})`;steps.forEach(s=>s.classList.toggle('lit',s.getBoundingClientRect().top<innerHeight*.72));if(!reduced&&y<1100)parallax.forEach(el=>el.style.translate=`0 ${y*Number(el.dataset.speed)}px`);scrollQueued=false}addEventListener('scroll',()=>{if(!scrollQueued){requestAnimationFrame(scrollUpdate);scrollQueued=true}},{passive:true});addEventListener('resize',scrollUpdate);scrollUpdate();
let state='after',metricFrame;function animateMetrics(next=state){state=next;cancelAnimationFrame(metricFrame);$$('[data-state]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.state===state));$('#active-state').textContent=state==='after'?CONFIG.afterLabel:CONFIG.baselineLabel;$('#active-tag').textContent=state==='after'?CONFIG.afterTag:CONFIG.baselineTag;const values=$$('[data-metric]'),start=performance.now();const origins=values.map(v=>Number(v.dataset.value)||0);function frame(t){const f=reduced?1:Math.min(1,(t-start)/1050),ease=1-Math.pow(1-f,3);values.forEach((v,i)=>{const m=CONFIG.metrics[i],target=m[state];const n=origins[i]+((target||0)-origins[i])*ease;v.textContent=target===null?format(null,m):format(n,m);v.dataset.value=n});if(f<1)metricFrame=requestAnimationFrame(frame)}metricFrame=requestAnimationFrame(frame);$$('[data-bar]').forEach((b,i)=>b.style.transform=`scaleX(${state==='after'?CONFIG.metrics[i].bar/100:0})`)}const metricObserver=new IntersectionObserver(es=>{if(es.some(e=>e.isIntersecting)){animateMetrics();metricObserver.disconnect()}},{threshold:.2});metricObserver.observe($('.comparison'));$$('[data-state]').forEach(b=>b.addEventListener('click',()=>animateMetrics(b.dataset.state)));
if(fine&&!reduced){document.body.classList.add('custom-cursor');let px=-100,py=-100,rx=-100,ry=-100,loop=0;const dot=$('.cursor-dot'),ring=$('.cursor-ring');function cursorFrame(){rx+=(px-rx)*.18;ry+=(py-ry)*.18;dot.style.transform=`translate(${px-2}px,${py-2}px)`;ring.style.transform=`translate(${rx-ring.offsetWidth/2}px,${ry-ring.offsetHeight/2}px)`;if(Math.abs(px-rx)+Math.abs(py-ry)>.1)loop=requestAnimationFrame(cursorFrame);else loop=0}document.addEventListener('pointermove',e=>{px=e.clientX;py=e.clientY;if(!loop)loop=requestAnimationFrame(cursorFrame);const target=e.target.closest('a,button,[data-cursor]');ring.classList.toggle('active',!!target);ring.textContent=target?.dataset.cursor||(target?.target==='_blank'?'Open':'')},{passive:true});document.addEventListener('pointerleave',()=>{dot.style.opacity=ring.style.opacity=0});document.addEventListener('pointerenter',()=>{dot.style.opacity=ring.style.opacity=1});const hero=$('.hero');hero.addEventListener('pointermove',e=>{const r=hero.getBoundingClientRect();$('.spotlight').style.setProperty('--sx',`${e.clientX-r.left}px`);$('.spotlight').style.setProperty('--sy',`${e.clientY-r.top}px`)},{passive:true});$$('.magnetic').forEach(b=>{b.addEventListener('pointermove',e=>{const r=b.getBoundingClientRect();b.style.transform=`translate(${(e.clientX-r.left-r.width/2)*.13}px,${(e.clientY-r.top-r.height/2)*.18}px)`});b.addEventListener('pointerleave',()=>b.style.transform='')});$$('.tilt').forEach(c=>{c.addEventListener('pointermove',e=>{const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;c.style.setProperty('--mx',x*100+'%');c.style.setProperty('--my',y*100+'%');c.style.transform=`perspective(1100px) rotateX(${(y-.5)*-5}deg) rotateY(${(x-.5)*5}deg)`});c.addEventListener('pointerleave',()=>c.style.transform='')})}
